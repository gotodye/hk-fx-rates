<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>香港同業匯率監控</title>
<!-- Inline SVG favicon: an upward trend line over the mint brand colour. Kept as a
     data: URI so there's no extra file to deploy and no 404 if the path shifts. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234FC0A4'/%3E%3Cpath d='M13 43 L26 30 L36 38 L51 21' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='51' cy='21' r='5' fill='white'/%3E%3C/svg%3E">
<meta name="theme-color" content="#4FC0A4">
<style>
  :root{
    --bg:#F4F7F6; --card:rgba(255,255,255,0.75); --card-solid:rgba(255,255,255,0.55);
    --surface:#ffffff;
    --primary:#88D8C0; --primary-deep:#4FC0A4; --secondary:#4B54C6;
    /* readable-text variants of the brand accents (the light shades fail WCAG AA
       as text; keep those for fills/badges, use these for coloured TEXT). */
    --primary-text:#0F7A62;
    --ink:#1E293B; --body:#475569; --muted:#5D6B7E;
    --up:#0E7A5F; --down:#C0392B; --amber:#E9A85C; --stale-text:#8A5A12;
    --radius-lg:20px; --radius-sm:12px;
    --shadow-out:6px 6px 16px rgba(163,177,198,0.35), -6px -6px 16px rgba(255,255,255,0.8);
    --shadow-in:inset 2px 2px 5px rgba(163,177,198,0.25), inset -2px -2px 5px rgba(255,255,255,0.75);
    --ease:cubic-bezier(0.4,0,0.2,1);
  }
  *{box-sizing:border-box;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  body{margin:0;padding:0 0 40px;font:15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
    background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased;}
  a{color:var(--secondary);}
  header{margin:22px auto 6px;max-width:1120px;padding:20px 26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.6);border-radius:var(--radius-lg);box-shadow:var(--shadow-out);}
  header .brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;}
  header h1{font-size:19px;margin:0;color:var(--ink);font-weight:700;}
  header .sub{font-size:12.5px;color:var(--muted);}
  /* Version chip + refresh status + last-change on their own tidy row under the
     title/buttons, so the two timestamps don't crowd the buttons or wrap messily. */
  .hmeta{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;
    justify-content:flex-end;margin-top:4px;padding-top:8px;
    border-top:1px solid rgba(163,177,198,0.16);}
  .hmeta:empty{display:none;}
  main{padding:18px 24px 0;max-width:1120px;margin:0 auto;}
  .grid{display:grid;gap:20px;}
  .card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.6);border-radius:var(--radius-lg);box-shadow:var(--shadow-out);padding:22px 24px;}
  h2{font-size:15.5px;margin:0 0 16px;color:var(--ink);font-weight:700;display:flex;align-items:center;gap:10px;}
  h2 .tag{font-size:12px;font-weight:600;color:var(--primary-text);background:rgba(136,216,192,0.18);padding:3px 10px;border-radius:20px;}
  .overflow{overflow-x:auto;}
  table{width:100%;border-collapse:separate;border-spacing:0 8px;}
  th{text-align:left;padding:4px 14px;color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;}
  td{padding:13px 14px;background:var(--card-solid);vertical-align:middle;
    border-top:1px solid rgba(255,255,255,0.5);border-bottom:1px solid rgba(163,177,198,0.10);}
  tr td:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm);border-left:1px solid rgba(255,255,255,0.5);}
  tr td:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0;border-right:1px solid rgba(163,177,198,0.10);}
  tbody tr{transition:all .25s var(--ease);}
  tbody tr:hover td{background:rgba(255,255,255,0.9);}
  td.name{color:var(--ink);font-weight:600;}
  td.rate{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);font-size:15.5px;}
  tr.best td{background:rgba(136,216,192,0.20);}
  tr.best td:first-child{box-shadow:inset 4px 0 0 var(--primary-deep);}
  tr.best td.rate{color:var(--primary-text);}
  tr.best td.name .star{color:var(--primary-text);margin-left:6px;font-size:12px;}
  .pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(148,163,184,0.15);color:var(--muted);white-space:nowrap;}
  .pill.web{color:var(--primary-text);background:rgba(136,216,192,0.20);}
  .pill.fb_ocr{color:var(--secondary);background:rgba(122,138,241,0.15);}
  .pill.manual{color:#8a7fd6;background:rgba(122,138,241,0.12);}
  .lowconf{color:var(--down);font-size:12px;font-weight:600;background:rgba(232,131,122,0.14);padding:2px 8px;border-radius:12px;}
  .stale{color:var(--stale-text);font-weight:600;background:rgba(233,168,92,0.16);padding:2px 8px;border-radius:12px;white-space:nowrap;cursor:help;}
  tr.self td{background:rgba(122,138,241,0.13);}
  tr.self td:first-child{box-shadow:inset 4px 0 0 var(--secondary);}
  tr.self td.name{color:var(--secondary);}
  .muted{color:var(--muted);font-size:13px;}
  .chart-tabs{display:flex;gap:10px;margin-bottom:14px;}
  .chart-tabs button{background:var(--card-solid);border:1px solid rgba(255,255,255,0.6);color:var(--body);
    border-radius:var(--radius-sm);padding:7px 16px;cursor:pointer;font-size:13px;font-weight:600;
    box-shadow:3px 3px 8px rgba(163,177,198,0.20), -3px -3px 8px rgba(255,255,255,0.7);transition:all .25s var(--ease);}
  .chart-tabs button.active{color:#fff;background:linear-gradient(135deg,#8FDCC6,var(--primary-deep));box-shadow:inset 1px 1px 3px rgba(79,192,164,0.3);}
  svg#chart{width:100%;height:270px;display:block;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--body);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  h3.group-head{font-size:14px;margin:18px 0 8px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;}
  h3.group-head:first-of-type{margin-top:4px;}
  h3.group-head .cnt{font-size:12px;font-weight:600;color:var(--muted);background:rgba(148,163,184,0.14);padding:2px 9px;border-radius:20px;}
  .up{color:var(--up);font-weight:700;}
  .down{color:var(--down);font-weight:700;}
  /* Promo badge + detail popup */
  .promo-badge{font:600 11px/1 inherit;color:#b06b00;background:rgba(233,168,92,0.22);
    border:0;border-radius:20px;padding:4px 9px;margin-left:6px;cursor:pointer;white-space:nowrap;
    transition:all .2s var(--ease);vertical-align:middle;}
  .promo-badge:hover{background:rgba(233,168,92,0.38);transform:scale(1.05);}
  .promo-badge.warn{color:#a4331f;background:rgba(232,131,122,0.22);}
  .promo-badge.warn:hover{background:rgba(232,131,122,0.38);}
  .promo-warn{margin:0 0 14px;padding:10px 12px;border-radius:var(--radius-sm);
    background:rgba(232,131,122,0.14);color:#a4331f;font-size:12.5px;line-height:1.5;}
  #promoModal{position:fixed;inset:0;z-index:10000;background:rgba(30,41,59,0.45);
    display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
  .promo-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-out);
    padding:26px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;}
  .promo-card h3{margin:0 0 16px;font-size:16px;color:var(--ink);}
  .promo-rates{display:flex;gap:12px;margin-bottom:16px;}
  .promo-rates>div{flex:1;background:var(--card-solid);border-radius:var(--radius-sm);padding:12px;text-align:center;}
  .promo-rates>div.hot{background:rgba(233,168,92,0.18);}
  .promo-rates span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;}
  .promo-rates b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .promo-rates .hot b{color:#b06b00;}
  .promo-row{display:flex;gap:10px;padding:8px 0;border-top:1px solid rgba(163,177,198,0.16);font-size:13px;}
  .promo-row span{color:var(--muted);min-width:66px;flex-shrink:0;}
  .promo-row b{color:var(--ink);font-weight:600;}
  .promo-img{width:100%;border-radius:var(--radius-sm);margin-top:14px;display:block;}
  .promo-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
  .promo-actions .btn{text-decoration:none;}
  /* Usage guide modal */
  #guideModal{position:fixed;inset:0;z-index:10000;background:rgba(30,41,59,0.45);
    display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
  .guide-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-out);
    max-width:640px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
  .guide-body{padding:26px 28px;overflow-y:auto;}
  .guide-body h3{margin:0 0 4px;font-size:18px;color:var(--ink);}
  .guide-body .g-sub{margin:0 0 18px;font-size:12.5px;color:var(--muted);}
  .guide-body h4{margin:22px 0 8px;font-size:14.5px;color:var(--primary-text);
    padding-bottom:6px;border-bottom:1px solid rgba(163,177,198,0.18);}
  .guide-body ul{margin:0;padding-left:20px;}
  .guide-body li{margin:6px 0;font-size:13.5px;line-height:1.6;color:var(--body);}
  .guide-body code{background:rgba(148,163,184,0.16);padding:1px 6px;border-radius:6px;
    font-size:12px;color:var(--ink);word-break:break-all;}
  .g-tbl{width:100%;border-collapse:collapse;font-size:13px;}
  .g-tbl td{padding:8px 10px;border-bottom:1px solid rgba(163,177,198,0.14);
    vertical-align:top;line-height:1.55;color:var(--body);}
  .g-tbl td:first-child{white-space:nowrap;width:1%;}
  .guide-body .g-note{margin:8px 0 0;padding:12px 14px;border-radius:var(--radius-sm);
    background:rgba(136,216,192,0.16);font-size:13px;line-height:1.6;color:var(--ink);}
  .guide-actions{padding:14px 24px;border-top:1px solid rgba(163,177,198,0.14);
    display:flex;justify-content:flex-end;flex-shrink:0;background:var(--card-solid);}
  /* Full-page sign-in gate */
  #gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:var(--bg);padding:24px;}
  .gate-card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.6);border-radius:var(--radius-lg);box-shadow:var(--shadow-out);
    padding:40px 36px;text-align:center;max-width:420px;width:100%;}
  .gate-card h1{font-size:20px;margin:0 0 4px;color:var(--ink);font-weight:700;}
  .gate-card .sub{font-size:12.5px;color:var(--muted);margin:0 0 26px;}
  .gate-card #gateBtn{display:flex;justify-content:center;min-height:44px;}
  .gate-hint{font-size:12.5px;color:var(--muted);margin:20px 0 0;}
  .gate-hint.err{color:var(--down);font-weight:600;}
  .edit-form{display:flex;flex-direction:column;gap:14px;}
  .edit-row{display:flex;gap:14px;flex-wrap:wrap;align-items:end;}
  .edit-form label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:5px;font-weight:600;}
  .edit-form input{background:var(--surface);color:var(--ink);border:1px solid rgba(148,163,184,0.22);
    border-radius:var(--radius-sm);padding:9px 12px;font-size:14px;box-shadow:var(--shadow-in);outline:none;min-width:150px;}
  .edit-form input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(136,216,192,0.35);}
  #saveStatus{font-size:13px;}
  .manual-block{padding:12px 0;border-top:1px solid rgba(163,177,198,0.14);}
  .manual-block:first-of-type{border-top:0;}
  .mp-name{font-weight:700;color:var(--ink);align-self:center;min-width:120px;}
  /* Design system: gradient mint, no hard borders, soft dual shadow, hover lift. */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:linear-gradient(135deg,#8FDCC6,var(--primary-deep));color:#fff;
    border:0;border-radius:var(--radius-sm);padding:9px 18px;
    font:inherit;font-size:14px;font-weight:600;line-height:1.2;cursor:pointer;
    box-shadow:4px 4px 10px rgba(79,192,164,0.28),-3px -3px 8px rgba(255,255,255,0.7);
    transition:transform .2s var(--ease),box-shadow .2s var(--ease),filter .2s var(--ease);}
  .btn:hover:not(:disabled){transform:scale(1.03);
    box-shadow:5px 5px 14px rgba(79,192,164,0.34),-4px -4px 10px rgba(255,255,255,0.85);}
  .btn:active:not(:disabled){transform:scale(0.98);box-shadow:var(--shadow-in);}
  .btn:disabled{opacity:.55;cursor:default;box-shadow:none;}
  .btn.secondary{background:var(--card-solid);color:var(--primary-text);
    box-shadow:3px 3px 8px rgba(163,177,198,0.20),-3px -3px 8px rgba(255,255,255,0.7);}
  .btn.secondary:hover:not(:disabled){
    box-shadow:4px 4px 12px rgba(163,177,198,0.28),-4px -4px 10px rgba(255,255,255,0.9);}
  /* Keyboard focus stays visible, but as a soft mint ring — never the UA's black box. */
  .btn:focus-visible,.linkbtn:focus-visible,.chart-tabs button:focus-visible{
    outline:none;box-shadow:0 0 0 3px rgba(136,216,192,0.5);}
  .btn:focus:not(:focus-visible),.linkbtn:focus:not(:focus-visible),
  .chart-tabs button:focus:not(:focus-visible){outline:none;}
  .ver{font:600 11.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--primary-text);
    background:rgba(136,216,192,0.18);padding:5px 10px;border-radius:20px;letter-spacing:.02em;
    cursor:default;align-self:center;}
  .linkbtn{background:none;border:0;color:var(--secondary);font-size:12px;font-weight:600;
    cursor:pointer;padding:2px 6px;border-radius:8px;transition:all .2s var(--ease);}
  .linkbtn:hover{background:rgba(122,138,241,0.12);}
  .fix-box{margin-top:12px;padding:14px 16px;border-radius:var(--radius-sm);
    background:rgba(122,138,241,0.08);border:1px solid rgba(122,138,241,0.25);}
  .fix-box .edit-row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:8px;}
  .fix-box label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:5px;font-weight:600;}
  .fix-box input{background:var(--surface);color:var(--ink);border:1px solid rgba(148,163,184,0.22);
    border-radius:var(--radius-sm);padding:8px 11px;font-size:14px;box-shadow:var(--shadow-in);outline:none;}
  .fix-box input:disabled{background:rgba(148,163,184,0.12);color:var(--muted);}
  .report-pre{white-space:pre-wrap;background:var(--card-solid);border:1px solid rgba(255,255,255,0.6);
    border-radius:var(--radius-sm);padding:14px 16px;margin:2px 0 0;
    font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);}
  /* Bigger hit area for the smallest control everywhere (WCAG 2.5.8 min 24px). */
  .linkbtn{min-height:28px;}
  /* Phones — this board is often opened from a Teams alert on a phone. Enlarge tap
     targets to ~44px, tighten padding, let the header wrap cleanly. */
  @media (max-width:640px){
    header{margin:12px 10px 6px;padding:14px 16px;gap:10px 14px;}
    main{padding:12px 10px 0;}
    .card{padding:16px 14px;}
    th,td{padding-left:10px;padding-right:10px;}
    .btn,.btn.secondary{min-height:44px;padding:11px 16px;}
    .chart-tabs button{min-height:44px;padding:10px 16px;}
    .linkbtn{min-height:40px;padding:9px 14px;font-size:13px;}
    .promo-badge{padding:7px 11px;}
    .ver{align-self:auto;}
    .hmeta{justify-content:flex-start;gap:6px 10px;}
    .promo-rates{flex-direction:column;}
    .guide-body{padding:20px 18px;}
  }
  /* Dark mode — flips the tokens; keeps the mint call-to-action buttons bright.
     Neumorphic dual-shadow is swapped for a plain soft shadow (the white highlight
     glows on a dark background). */
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0F1620; --card:rgba(28,38,52,0.72); --card-solid:rgba(28,38,52,0.5); --surface:#1B2532;
      --primary:#5EE0C4; --primary-deep:#43D6B4; --secondary:#AAB2FF; --primary-text:#4FD6B6;
      --ink:#EEF3F8; --body:#C4CFDC; --muted:#93A2B4;
      --up:#4ADE80; --down:#F98A7E; --amber:#E9A85C; --stale-text:#E3B267;
      --shadow-out:0 2px 12px rgba(0,0,0,0.5); --shadow-in:inset 0 1px 3px rgba(0,0,0,0.45);
    }
    header,.card,.gate-card,.chart-tabs button,.btn.secondary{border-color:rgba(255,255,255,0.08);}
    td{border-top-color:rgba(255,255,255,0.05);border-bottom-color:rgba(0,0,0,0.28);}
    tr td:first-child{border-left-color:rgba(255,255,255,0.05);}
    tr td:last-child{border-right-color:rgba(0,0,0,0.28);}
    tbody tr:hover td{background:rgba(255,255,255,0.06);}
    .edit-form input,.fix-box input{border-color:rgba(148,163,184,0.3);}
  }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<body>
<!-- Sign-in gate. Note this hides the UI, it does not protect the data: the page
     and data.json are on public GitHub Pages, so treat it as keeping the board
     out of casual view, not as a security boundary. -->
<div id="gate">
  <div class="gate-card">
    <h1>香港同業匯率監控</h1>
    <p class="sub">HK Competitor FX Monitor</p>
    <div id="gateBtn"></div>
    <p class="gate-hint" id="gateHint">請用授權的 Google 帳號登入</p>
  </div>
</div>

<div id="shell" hidden>
<header>
  <div class="brand">
    <h1 id="hTitle">香港同業匯率監控</h1>
    <span class="sub">HK Competitor FX Monitor · HKD → IDR</span>
  </div>
  <button class="btn" id="refreshBtn" type="button" style="padding:6px 14px">立即更新</button>
  <button class="btn secondary" id="guideBtn" type="button" style="padding:6px 14px">使用手冊</button>
  <button class="btn secondary" id="langBtn" type="button" style="padding:6px 14px">EN</button>
  <div class="hmeta">
    <span id="ver" class="ver" hidden></span>
    <span id="refreshStatus" class="muted"></span>
    <span id="updated" class="muted"></span>
  </div>
</header>

<main class="grid" id="app">
  <section class="card"><p class="muted">載入中…</p></section>
</main>
</div>

<script>
const COLORS=["#7A8AF1","#4FC0A4","#E9A85C","#E8837A","#9AA5B1"];
const METHOD_LABEL={web:"web",fb_ocr:"fb_ocr",manual:"manual",proxy:"proxy"};
const CCY_FLAG={IDR:"🇮🇩",PHP:"🇵🇭"};
const K=(pk,f,t)=>`${pk}|${f}|${t}`;

// The one place display reads a provider's current cell. Manual providers come
// from MANUAL (manual.json — what the editor writes, so board/editor/report always
// agree and a save shows instantly); everything else (auto providers, or a manual
// field not yet in manual.json) falls back to the server-baked DATA.latest.
function cellFor(pk,f,t){
  const key=K(pk,f,t);
  const p=(DATA.providers||[]).find(x=>x.key===pk);
  if(p && !p.auto && MANUAL){
    const raw=(MANUAL[pk]||{})[`${f}->${t}`];
    if(raw!==undefined && raw!=="" && raw!==null && isFinite(Number(raw)) && Number(raw)>0){
      // captured_at:null on purpose — a human-entered rate has no scrape time and
      // must NOT show a "time (Nh) ⚠" stale badge like an OCR/scraped value would.
      return {rate:Number(raw),method:"manual",confidence:1.0,note:"manual.json",
              source_url:null,raw_ref:null,promo:null,is_promo_rate:false,captured_at:null};
    }
  }
  let cell=DATA.latest[key];
  // Apply a still-valid correction (mirrors app/ci.py::_apply_corrections): only
  // while the scraped source STILL reports the flagged wrong value; once the source
  // genuinely changes it stops matching and expires by itself. A human correction
  // also asserts "this is the real standard rate", so drop the promo-headline flag.
  if(CORRECTIONS && cell && cell.rate!=null){
    const c=CORRECTIONS[key];
    if(c && c.correct_rate!=null && c.wrong_rate>0 &&
       Math.abs(cell.rate-c.wrong_rate)/c.wrong_rate < 1e-6){
      cell={...cell, rate:Number(c.correct_rate), is_promo_rate:false,

// A rate that stopped refreshing looks identical to a current one — that's how a
// day-old Chandra number sat on the board unnoticed. Facebook intermittently
// blocks the runner, so this will happen again; surface it instead of hiding it.
const STALE_HOURS=6;
function staleTs(iso){
  const t=new Date(iso);
  const txt=t.toLocaleString(loc(),{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  const hrs=(Date.now()-t.getTime())/3600000;
  if(hrs<STALE_HOURS) return txt;
  const age=hrs<24?`${Math.floor(hrs)}h`:`${Math.floor(hrs/24)}d`;
  return `<span class="stale" title="${L("staleTip")}">⚠ ${txt} (${age})</span>`;
}

// waiter resolves on ITS OWN condition. A manual save waits until data.json shows
// ITS value — not merely "some republish", which with concurrent saves could be an
// earlier save's run that hasn't included this provider yet, giving a premature and
// misleading "✅ Updated". render() runs only when generated_at actually advances.
let _pollWaiters=[], _pollActive=false;
function pollForData(check, tries=24){
  return new Promise(resolve=>{
    _pollWaiters.push({check,resolve});
    if(_pollActive) return;
    _pollActive=true;
    (async()=>{
      try{
        for(let i=0;i<tries && _pollWaiters.length;i++){
          await new Promise(x=>setTimeout(x,5000));
          let fresh=null;
          try{ const r=await fetch("./data.json?_="+Date.now(),{cache:"no-store"}); if(r.ok) fresh=await r.json(); }catch(e){}
          if(!fresh) continue;
          if(fresh.generated_at && fresh.generated_at!==DATA.generated_at){ DATA=fresh; render(); }
          _pollWaiters=_pollWaiters.filter(w=>{ try{ if(w.check(fresh)){ w.resolve(true); return false; } }catch(e){} return true; });
        }
      } finally { _pollWaiters.forEach(w=>w.resolve(false)); _pollWaiters=[]; _pollActive=false; }
    })();
  });
}
// Watch until data.json is republished past `before` (used by the correction flow).
const pollUntilPublished=(before,tries=24)=>pollForData(fresh=>!!fresh.generated_at&&fresh.generated_at!==before,tries);

// Every full run stamps last_run.json, even a quiet one — data.json is only
// rewritten when a rate actually moves, so it can't tell "finished, nothing
// changed" from "still running". This can.
async function fetchLastRun(){
  try{
    const r=await fetch("./last_run.json?_="+Date.now(),{cache:"no-store"});
    if(r.ok) return await r.json();
  }catch(e){}
  return null;
}

async function pollRefresh(beforeRun, beforeData, tries=36){
  for(let i=0;i<tries;i++){
    await new Promise(x=>setTimeout(x,5000));
    const lr=await fetchLastRun();
    if(!lr||!lr.at||lr.at===beforeRun) continue;
    LAST_RUN=lr;
    try{
      const res=await fetch("./data.json?_="+Date.now(),{cache:"no-store"});
      if(res.ok){ const fresh=await res.json(); if(fresh.generated_at) DATA=fresh; }
    }catch(e){}
    render(); showNextAuto();
    return {done:true, changed:!!(DATA&&DATA.generated_at!==beforeData)};
  }
  return {done:false};
}

// When idle, the status line doubles as "when will this update by itself".
function showNextAuto(){
  const st=document.getElementById("refreshStatus");
  if(!st) return;
  const nxt=LAST_RUN&&LAST_RUN.next_auto_at?new Date(LAST_RUN.next_auto_at):null;
  st.textContent=(nxt&&nxt>new Date())
    ? L("nextAuto")+nxt.toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Taipei"})
    : "";
}

// "Refresh now" — GitHub drops most scheduled runs, but workflow_dispatch always
// fires. force=true also bypasses the cooldown gate, and stamping last_run.json
// pushes the next automatic run a full cooldown out from this manual update.
async function refreshNow(){
  const btn=document.getElementById("refreshBtn");
  const st=document.getElementById("refreshStatus");
  const setS=m=>{ if(st) st.textContent=m; };
  if(btn) btn.disabled=true;
  setS(L("refreshing"));
  const before=(await fetchLastRun())||LAST_RUN;
  const d=await workerRefresh();
  if(!d.ok){ setS(L("refreshFail")); if(btn) btn.disabled=false; return; }
  const r=await pollRefresh(before?before.at:null, DATA?DATA.generated_at:null);
  setS(!r.done?L("refreshSlow"):(r.changed?L("refreshed"):L("refreshedSame")));
  if(btn) btn.disabled=false;
}

// Stamped by the publishing workflow from the private repo's git history, so the
// number is the real revision count — not something anyone has to remember to bump.
let VER=null;
function showVersion(){
  const el=document.getElementById("ver");
  if(!el||!VER||!VER.count) return;
  el.textContent="v"+VER.count;
  el.title=L("verTip").replace("%n",VER.count).replace("%s",VER.sha||"?")
    .replace("%d",VER.built_at?new Date(VER.built_at).toLocaleString(loc(),{timeZone:"Asia/Taipei"}):"?");
  el.hidden=false;
}
fetch("./version.json?_="+Date.now(),{cache:"no-store"})
  .then(r=>r.ok?r.json():null).then(v=>{VER=v;showVersion();}).catch(e=>{});

let DATA=null, LAST_RUN=null;
// manual.json (data repo `main`). Browser SOURCE OF TRUTH for manual-provider
// display: merged over data.json at render time via cellFor(), so the board,
// editor and report always agree and a manual save shows instantly — no waiting
// for the apply-manual workflow to bake it into data.json (gh-pages).
let MANUAL=null;
// corrections.json (data repo `main`), the `corrections` map. Same idea as MANUAL:
// cellFor() applies a still-valid correction over the scraped value at render time,
// so a submitted "Fix" shows instantly and identically on the board AND the report,
// instead of waiting ~30-60s for the server to bake it into data.json.
let CORRECTIONS=null;

// Deferred until the gate opens — no point fetching a board nobody may see.
function loadData(){
  // Fetch the board data AND manual.json together; render once both settle so the
  // first paint is already merged. A manual.json failure is tolerated (render falls
  // back to data.json for manual providers).
  Promise.all([
    fetch("./data.json?_="+Date.now(),{cache:"no-store"}).then(r=>r.json()),
    fetchManualJson().catch(()=>null),
    fetchCorrectionsJson().catch(()=>null),
  ]).then(([d,m,c])=>{ DATA=d; MANUAL=m; CORRECTIONS=(c&&c.corrections)||null; render(); })
    .catch(e=>{document.getElementById("app").innerHTML=
      `<section class="card"><p class="muted">${L("noData")}</p></section>`;});
  fetchLastRun().then(lr=>{ LAST_RUN=lr; showNextAuto(); });
  startAutoRefresh();
}

// ---- Keep a long-lived tab current, without a manual reload --------------------
const POLL_MS=60000;
let pollTimer=null;

/** True while someone is filling in a rate — re-rendering would wipe what they typed. */
function isEditing(){
  const a=document.activeElement;
  return !!(a && a.tagName==="INPUT" && (a.dataset.mk!==undefined || a.id==="fixVal" || a.id==="fixNote"));
}

async function pollForUpdate(){
  if(document.hidden || isEditing()) return;   // retry on the next tick
  try{
    const [fresh,mFresh,cFresh]=await Promise.all([
      fetch("./data.json?_="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null),
      fetchManualJson().catch(()=>MANUAL),   // also pick up a colleague's manual save
      fetchCorrectionsJson().catch(()=>null),// …and a colleague's correction
    ]);
    // Only touch the DOM when something actually moved: a needless re-render would
    // reset the chart tab and scroll position while someone is reading. Manual values
    // and corrections live in MANUAL/CORRECTIONS, so watch them too, not just
    // data.json's generated_at.
    const cNew = cFresh ? ((cFresh.corrections)||{}) : null;
    const dataMoved = fresh && (!DATA || fresh.generated_at!==DATA.generated_at);
    const manualMoved = mFresh && JSON.stringify(mFresh)!==JSON.stringify(MANUAL);
    const corrMoved = cNew && JSON.stringify(cNew)!==JSON.stringify(CORRECTIONS);
    if(fresh) DATA=fresh;
    if(mFresh) MANUAL=mFresh;
    if(cNew) CORRECTIONS=cNew;
    if(dataMoved || manualMoved || corrMoved){ render(); syncManualInputs(); flashUpdated(); }
  }catch(e){ /* transient: keep polling */ }
  fetchLastRun().then(lr=>{ LAST_RUN=lr; showNextAuto(); }).catch(e=>{});
}

function flashUpdated(){
  const el=document.getElementById("updated");
  if(!el) return;
  el.style.transition="none"; el.style.color="var(--primary-deep)";
  setTimeout(()=>{ el.style.transition="color 1.5s"; el.style.color=""; },80);
}

function startAutoRefresh(){
  if(pollTimer) return;
  pollTimer=setInterval(pollForUpdate,POLL_MS);
  // A backgrounded tab gets throttled, so check once the moment it's looked at again.
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) pollForUpdate(); });
}

function render(){
  const app=document.getElementById("app");
  const upd=DATA.generated_at?new Date(DATA.generated_at).toLocaleString(loc()):"—";
  document.getElementById("updated").textContent=L("lastChange")+upd;
  let html="";

  for(const [f,t] of DATA.corridors){
    const rows=DATA.providers.filter(p=>p.corridors.some(c=>c[0]===f&&c[1]===t));
    const cells=rows.map(p=>({p,cell:cellFor(p.key,f,t)}));
    // ★ marks the best COMPETITOR rate — our own row is the benchmark you compare
    // against, so including it would just star ourselves and hide who's beating us.
    const rates=cells.filter(x=>!x.p.is_self&&x.cell&&x.cell.rate!=null).map(x=>x.cell.rate);
    const best=rates.length?Math.max(...rates):null;
    const ourRate=(cells.find(x=>x.p.is_self)||{}).cell;
    html+=`<section class="card"><h2>${f} → ${t} <span class="tag">${L("latest")}</span></h2><div class="overflow"><table>`
      +`<thead><tr><th scope="col">${L("provider")}</th><th scope="col">1 ${f} =</th><th scope="col">${L("source")}</th><th scope="col">${L("conf")}</th><th scope="col">${L("updated")}</th><th scope="col"><span class="sr-only">${L("fixTitle")}</span></th></tr></thead><tbody>`;
    for(const {p,cell} of cells){
      const isBest=cell&&best!=null&&cell.rate===best;
      const badge=p.auto?"":` <span class="pill manual">${L("manual")}</span>`;
      const star=isBest?'<span class="star">★</span>':"";
      const rate=cell&&cell.rate!=null?fmt(cell.rate):'<span class="muted">—</span>';
      let method='<span class="muted">—</span>';
      if(cell&&cell.method){
        const pill=`<span class="pill ${cell.method}" title="${escA(cell.note||'')}">${esc(METHOD_LABEL[cell.method]||cell.method)}</span>`;
        const src=cell.source_url?`<a href="${esc(cell.source_url)}" target="_blank" rel="noopener">${pill}</a>`:pill;
        const img=cell.raw_ref?` <a href="${esc(cell.raw_ref)}" target="_blank" rel="noopener" title="來源圖片 source image">🖼</a>`:"";
        method=src+img;
      }
      let conf='<span class="muted">—</span>';
      if(cell&&cell.confidence!=null){const pc=Math.round(cell.confidence*100);
        conf=cell.confidence<0.6?`<span class="lowconf">${L("low")} ${pc}%⚠</span>`:`${pc}%`;}
      const ts=cell&&cell.captured_at?staleTs(cell.captured_at):"—";
      // auto-scraped rows get a "fix" entry point (manual rows are edited below).
      // data-cur is the RAW scraped value (not `cell` which may already be corrected),
      // so a correction's "wrong" matches the source and re-correcting works.
      const scraped=(DATA.latest[K(p.key,f,t)]||{}).rate;
      const fixBtn=(p.auto && cell && cell.rate!=null && scraped!=null)
        ? `<button class="linkbtn" type="button" data-fix="${K(p.key,f,t)}" data-cur="${scraped}">${L("fixTitle")}</button>`
        : "";
      // How we stack up against the best competitor — the number this whole board exists for.
      let gap="";
      if(p.is_self&&cell&&cell.rate!=null&&best!=null){
        const d=cell.rate-best, pct=(d/best*100).toFixed(2);
        gap=d>=0
          ? ` <span class="up">▲ ${L("gapAhead").replace("%s",(+pct).toFixed(2))}</span>`
          : ` <span class="down">▼ ${L("gapBehind").replace("%s",Math.abs(pct))}</span>`;
      }
      // A promo running alongside the standard rate (weekend / capped / branch-only).
      // Shown next to it, not instead of it — it's real competitive info, but not
      // the rate an ordinary customer gets.
      // Two cases: a promo running *alongside* a standard rate (badge shows the
      // promo price), or the headline number IS a promo because no standard card
      // was available (badge warns that this figure is restricted).
      let promoBadge="";
      if(cell&&cell.is_promo_rate){
        promoBadge=` <button class="promo-badge warn" type="button" data-promo="${K(p.key,f,t)}" title="${L("promoOnlyTip")}">${L("promoOnlyTag")}</button>`;
      }else if(cell&&cell.promo&&cell.promo.rate!=null){
        promoBadge=` <button class="promo-badge" type="button" data-promo="${K(p.key,f,t)}" title="${L("promoTip")}">${L("promoTag")} ${fmt(cell.promo.rate,2)}</button>`;
      }
      html+=`<tr class="${p.is_self?'self':(isBest?'best':'')}"><td class="name">${esc(p.name)}${badge}${star}</td>`
        +`<td class="rate">${rate}${gap}${promoBadge}</td><td>${method}</td><td>${conf}</td>`
        +`<td class="muted">${ts}</td><td>${fixBtn}</td></tr>`;
    }
    html+="</tbody></table></div></section>";
  }

  // history chart
  html+=`<section class="card"><h2>${L("history")}</h2><div class="chart-tabs" id="chartTabs">`
    +DATA.corridors.map((c,i)=>`<button data-f="${c[0]}" data-t="${c[1]}" class="${i===0?'active':''}">${c[0]}→${c[1]}</button>`).join("")
    +`</div><svg id="chart" viewBox="0 0 800 270" preserveAspectRatio="none"></svg><div class="legend" id="legend"></div></section>`;

  // recent changes grouped by provider
  html+=`<section class="card"><h2>${L("recent")} <span class="tag">${L("byProv")}</span></h2>`;
  const changes=DATA.changes||[];
  if(changes.length){
    const byProv={};
    for(const ch of changes){(byProv[ch.provider]=byProv[ch.provider]||[]).push(ch);}
    for(const prov of Object.keys(byProv)){
      const items=byProv[prov];
      html+=`<h3 class="group-head">${esc(prov)} <span class="cnt">${items.length}</span></h3><div class="overflow"><table>`
        +`<thead><tr><th scope="col">${L("corridor")}</th><th scope="col">${L("oldv")}</th><th scope="col">${L("newv")}</th><th scope="col">${L("dir")}</th><th scope="col">${L("time")}</th></tr></thead><tbody>`;
      for(const ch of items){
        const flag=CCY_FLAG[ch.to_ccy]||"";
        const pillCls=ch.to_ccy==="IDR"?"fb_ocr":(ch.to_ccy==="PHP"?"web":"");
        const dir=ch.old_rate&&ch.new_rate>ch.old_rate?`<span class="up">${L("up")}</span>`
          :(ch.old_rate&&ch.new_rate<ch.old_rate?`<span class="down">${L("down")}</span>`:'<span class="muted">—</span>');
        const ts=ch.changed_at?new Date(ch.changed_at).toLocaleString(loc(),{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
        html+=`<tr><td><span class="pill ${pillCls}">${flag} ${esc(ch.to_ccy)}</span></td>`
          +`<td class="muted">${fmt(ch.old_rate)}</td><td class="rate">${fmt(ch.new_rate)}</td>`
          +`<td>${dir}</td><td class="muted">${ts}</td></tr>`;
      }
      html+="</tbody></table></div>";
    }
  } else { html+=`<p class="muted">${L("noChanges")}</p>`; }
  html+='</section>';

  // Two regions: #board (data — re-rendered on every refresh) and #panel (the
  // interactive editor/report — built ONCE). Rebuilding the panel on every rate
  // refresh tore down the manual inputs and wiped whatever the user was typing
  // (a background apply-poll render blanked the fields — the recorded bug). The
  // panel only rebuilds when its structure actually changes (providers/corridors/
  // correction log), not when a rate ticks.
  let board=document.getElementById("board"), panel=document.getElementById("panel");
  if(!board||!panel){
    app.innerHTML='<div id="board"></div><div id="panel"></div>';
    board=document.getElementById("board"); panel=document.getElementById("panel");
  }
  board.innerHTML=html;
  board.querySelectorAll("[data-fix]").forEach(b=>
    b.addEventListener("click",()=>openFixDialog(b.dataset.fix, b.dataset.cur)));
  board.querySelectorAll("[data-promo]").forEach(b=>
    b.addEventListener("click",()=>openPromo(b.dataset.promo)));
  const tabs=document.getElementById("chartTabs");
  if(tabs){
    tabs.addEventListener("click",e=>{
      if(e.target.tagName!=="BUTTON")return;
      tabs.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
      e.target.classList.add("active");
      drawCorridor(e.target.dataset.f,e.target.dataset.t);
    });
    const first=tabs.querySelector("button");
    if(first)drawCorridor(first.dataset.f,first.dataset.t);
  }

  // Include auth state: signing in/out must rebuild the editor (show inputs vs the
  // Google button). Without this the panel-once optimisation left it stuck.
  const sig=JSON.stringify([signedIn(),DATA.providers,DATA.corridors,DATA.correction_log||[]]);
  if(panel.dataset.sig!==sig){
    panel.innerHTML=manualCardHtml()+correctionLogHtml()+reportCardHtml();
    panel.dataset.sig=sig;
    wireManual();   // fills inputs from manual.json + wires save buttons + wireReport()
  }
}

const MANUAL_REPO="gotodye/hk-fx-rates";  // dashboard/data repo (no source code)

// ---- Google Sign-In + write-proxy -------------------------------------------
// Editors used to paste a GitHub token into this page. A static page can't keep a
// token secret, so instead we prove who the user is with Google and let the Worker
// (which holds the only token, server-side) do the writing.
const WORKER_URL="https://fx-editor.gotodye.workers.dev";
const GOOGLE_CLIENT_ID="886357734464-3vsdtgn5361113f43sf0568686v1s8nt.apps.googleusercontent.com";

let GOOGLE_CRED=null;   // the ID token from Google; kept in memory only
let GOOGLE_USER=null;   // {email, name, picture}
let SESSION_EXPIRED=false;   // set when the Worker rejects the (expired) token, so the editor re-prompts

function parseJwt(t){
  try{
    const p=t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    return JSON.parse(decodeURIComponent(escape(atob(p))));
  }catch(e){ return null; }
}

// Google calls this after a successful sign-in.
async function onGoogleCredential(resp){
  GOOGLE_CRED=resp.credential;
  const c=parseJwt(GOOGLE_CRED);
  GOOGLE_USER=c?{email:(c.email||"").toLowerCase(),name:c.name||"",picture:c.picture||""}:null;
  // Remember only the email, to greet the user on reload — never the credential,
  // which is short-lived and must not be persisted.
  if(GOOGLE_USER) localStorage.setItem("fxEmail",GOOGLE_USER.email);

  // The whitelist lives in the Worker, so ask it rather than trusting the client.
  const hint=document.getElementById("gateHint");
  if(hint){ hint.className="gate-hint"; hint.textContent=L("gateChecking"); }
  const v=await workerVerify();
  if(!v.ok){
    GOOGLE_CRED=null; GOOGLE_USER=null;
    if(hint){ hint.className="gate-hint err"; hint.textContent=v.error; }
    try{ google.accounts.id.disableAutoSelect(); }catch(e){}
    return;
  }
  SESSION_EXPIRED=false;   // fresh, valid token — clear any prior expiry state
  unlock();
}

/** Ask the Worker whether this signed-in user is allowed to see the board. */
async function workerVerify(){
  if(!GOOGLE_CRED) return {ok:false,error:L("needLogin")};
  try{
    const r=await fetch(WORKER_URL,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id_token:GOOGLE_CRED,action:"verify"})
    });
    const d=await r.json().catch(()=>({}));
    return r.ok?{ok:true}:{ok:false,error:d.error||`HTTP ${r.status}`};
  }catch(e){ return {ok:false,error:L("gateNetFail")}; }
}

/** Reveal the dashboard once the user is verified. */
function unlock(){
  const gate=document.getElementById("gate"), shell=document.getElementById("shell");
  if(gate) gate.remove();
  if(shell) shell.hidden=false;
  if(!DATA) loadData(); else render();
}

/** Put Google's button on the gate and offer one-tap for returning users. */
function initAuth(){
  const slot=document.getElementById("gateBtn");
  if(!slot) return;               // already unlocked
  if(!(window.google&&google.accounts)){ setTimeout(initAuth,300); return; }
  try{
    google.accounts.id.initialize({
      client_id:GOOGLE_CLIENT_ID, callback:onGoogleCredential, auto_select:true,
    });
    google.accounts.id.renderButton(slot,{theme:"outline",size:"large",text:"signin_with",shape:"pill"});
    google.accounts.id.prompt();  // silently signs returning users back in
  }catch(e){
    const hint=document.getElementById("gateHint");
    if(hint){ hint.className="gate-hint err"; hint.textContent=L("gLoadFail"); }
  }
}

function signedIn(){ return !!(GOOGLE_CRED && GOOGLE_USER); }

function googleSignOut(){
  GOOGLE_CRED=null; GOOGLE_USER=null;
  localStorage.removeItem("fxEmail");
  try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  render();
}

/** Ask the Worker to run one of the allowlisted workflows (it holds that token). */
async function workerDispatch(workflow, inputs){
  if(!signedIn()) return {ok:false,error:L("needLogin")};
  try{
    const r=await fetch(WORKER_URL,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id_token:GOOGLE_CRED,action:"dispatch",workflow,inputs})
    });
    const d=await r.json().catch(()=>({}));
    if(r.ok) return {ok:true};
    if(r.status===401){ expireSession(); return {ok:false,error:L("sessionExpired")}; }
    return {ok:false,error:d.error||`HTTP ${r.status}`};
  }catch(e){ return {ok:false,error:e.message}; }
}
const workerRefresh=()=>workerDispatch("monitor.yml",{force:"true"});

// Google ID tokens expire after ~1h. When the Worker rejects one, drop it and flip
// the editor back to a sign-in prompt IN PLACE, so the user can re-auth without a
// silent save failure or a page reload.
function expireSession(){
  GOOGLE_CRED=null; GOOGLE_USER=null; SESSION_EXPIRED=true;
  try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  if(DATA) render();
}

/** POST a file update through the Worker. Returns {ok} or {ok:false,error}. */
async function workerWrite(file, content){
  if(!signedIn()) return {ok:false,error:L("needLogin")};
  try{
    const r=await fetch(WORKER_URL,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id_token:GOOGLE_CRED,file,content})
    });
    const d=await r.json().catch(()=>({}));
    if(r.ok) return {ok:true};
    // Google ID tokens expire after ~1h; say so plainly instead of a raw 401.
    if(r.status===401){ expireSession(); return {ok:false,error:L("sessionExpired")}; }
    return {ok:false,error:d.error||`HTTP ${r.status}`};
  }catch(e){ return {ok:false,error:e.message}; }
}

function b64utf8(s){ return btoa(String.fromCharCode.apply(null,new TextEncoder().encode(s))); }
function b64toUtf8(b64){ try{ return new TextDecoder().decode(Uint8Array.from(atob((b64||"").replace(/\n/g,"")),c=>c.charCodeAt(0))); }catch(e){ return "{}"; } }

// Each manual provider gets its OWN inputs + save button (save independently).
function manualCardHtml(){
  const manual=(DATA.providers||[]).filter(p=>!p.auto);
  if(!manual.length) return "";
  // Only offer inputs for corridors the board actually shows — a corridor gated
  // off until launch (server drops it from DATA.corridors) shouldn't get a dead
  // input that saves a value which then never appears.
  const vis=new Set((DATA.corridors||[]).map(c=>c[0]+"|"+c[1]));

    }

      +`<div class="muted" data-status="${p.key}"></div></div>`;

    +`</div></section>`;
}


// Read manual.json from the GitHub CONTENTS API (read-after-write consistent),
// falling back to the raw CDN. The raw CDN can be ~5 min stale, and we MERGE onto
// this base before writing the whole file back — a stale base would silently revert
// a colleague's recent edit to another provider.
// Read a JSON file from the data repo's main branch, contents-API first (read-after-
// write consistent) then raw CDN fallback. Used for manual.json + corrections.json.
async function fetchRepoJson(file){
  const api=`https://api.github.com/repos/${MANUAL_REPO}/contents/${file}?ref=main&_=`+Date.now();
  try{
    const r=await fetch(api,{headers:{Accept:"application/vnd.github.raw"},cache:"no-store"});
    if(r.ok){ const j=await r.json(); if(j&&typeof j==="object") return j; }
  }catch(e){}
  try{
    const r=await fetch(`https://raw.githubusercontent.com/${MANUAL_REPO}/main/${file}?_=`+Date.now(),{cache:"no-store"});
    if(r.ok){ const j=await r.json(); if(j&&typeof j==="object") return j; }
  }catch(e){}
  return null;
}
async function fetchManualJson(){ return fetchRepoJson("manual.json"); }
async function fetchCorrectionsJson(){ return fetchRepoJson("corrections.json"); }

async function saveManualProvider(key){
  const st=document.querySelector(`[data-status="${key}"]`);
  const setS=m=>{ if(st) st.textContent=m; };
  if(!signedIn()){ setS(L("needLogin")); return; }

  // collect + VALIDATE this provider's field values. A stray comma/letter made
  // Number() return NaN, which JSON-serialised to null and silently BLANKED the
  // rate — reject it loudly instead. Blank = intentionally unchanged.
  const updates={};
  let bad=false;
  document.querySelectorAll(`input[data-mk^="${key}|"]`).forEach(inp=>{
    const parts=inp.dataset.mk.split("|");
    const raw=(inp.value||"").trim();
    if(raw===""){ updates[`${parts[1]}->${parts[2]}`]=""; return; }
    const n=Number(raw);
    if(!isFinite(n)||n<=0){ bad=true; inp.style.borderColor="var(--down)"; return; }
    inp.style.borderColor="";
    updates[`${parts[1]}->${parts[2]}`]=n;
  });
  if(bad){ setS(L("stBadNumber")); return; }
  setS(L("stSaving"));

  // Read the CURRENT file (fresh, contents API) and merge only this provider's
  // fields, so a colleague editing another provider isn't clobbered, then let the
  // Worker commit it.
  let manual=await fetchManualJson();
  if(!manual){ setS(L("stReadFail")); return; }
  if(!manual._comment) manual._comment="在儀表板『編輯人工匯率』填寫即可。數字 = 1 HKD 換多少當地幣。";
  manual[key]=Object.assign(manual[key]||{}, updates);

  const res=await workerWrite("manual.json", manual);
  if(!res.ok){ setS(`${L("stFail")}${res.error}`); return; }

  // manual.json is the browser's display source of truth, so update it from the
  // object we just persisted and re-render — the board, editor and report reflect
  // the new value INSTANTLY. No optimistic overlay, no polling. The workflow below
  // bakes it into data.json (for history + scheduled reports) in the background;
  // the display no longer depends on that round-trip.
  MANUAL=manual;
  render();
  setS(L("stSaved"));
  workerDispatch("apply-manual.yml");   // fire-and-forget: bake into data.json/history
}

// Fill the manual inputs from MANUAL, but never overwrite a field someone is
// actively typing in. Called on panel build and after a background MANUAL refresh.
function syncManualInputs(){
  if(!MANUAL) return;
  document.querySelectorAll("input[data-mk]").forEach(inp=>{
    if(inp===document.activeElement) return;   // don't stomp in-progress typing
    const [k,f,t]=inp.dataset.mk.split("|");
    const v=(MANUAL[k]||{})[`${f}->${t}`];
    inp.value=(v!==undefined&&v!=="")?v:"";
  });
}

async function wireManual(){
  mountGoogleButton();
  const so=document.getElementById("signOutBtn");
  if(so) so.addEventListener("click",googleSignOut);
  // Prefill from the already-loaded MANUAL (fetch only if it isn't loaded yet).
  if(!MANUAL){ MANUAL=await fetchManualJson().catch(()=>null); }
  syncManualInputs();
  document.querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click",()=>saveManualProvider(b.dataset.save)));
  // Editing a field clears that provider's stale status: a leftover "✅ Updated"
  // sitting next to a newly-typed (unsaved) value made the editor look like it
  // disagreed with the board/report (it didn't — the message was just stale).
  document.querySelectorAll("input[data-mk]").forEach(inp=>{
    inp.addEventListener("input",()=>{
      inp.style.borderColor="";
      const st=document.querySelector(`[data-status="${inp.dataset.mk.split("|")[0]}"]`);
      if(st) st.textContent="";
    });
  });
  wireReport();
}

async function submitFix(key, wrongRate, box){
  const st=box.querySelector("#fixStatus");
  const setS=m=>{ if(st) st.textContent=m; };
  const val=(box.querySelector("#fixVal").value||"").trim();
  if(val==="") { setS("⚠ "+L("fixCorrect")); return; }
  if(!signedIn()){ setS(L("needLogin")); return; }
  setS(L("stSaving"));

  const entry={wrong_rate:Number(wrongRate), correct_rate:Number(val),
    corrected_at:new Date().toISOString(), note:(box.querySelector("#fixNote").value||"").trim(),
    by:(GOOGLE_USER&&GOOGLE_USER.email)||""};

  // Read the current corrections.json fresh (contents API) so a colleague's other
  // correction isn't clobbered, then merge this one in.
  let doc=await fetchCorrectionsJson();
  if(!doc||typeof doc!=="object") doc={};
  if(!doc._comment) doc._comment="匯率修正：只要來源仍是錯值就自動套用；來源改變後自動失效。";
  doc.corrections=doc.corrections||{};
  doc.corrections[key]=entry;

  const res=await workerWrite("corrections.json", doc);
  if(!res.ok){ setS(`${L("stFail")}${res.error}`); return; }

  // corrections.json is the browser's source of truth for corrections (cellFor
  // applies a still-valid one), so update it and re-render — the board AND report
  // reflect the fix INSTANTLY and identically, no optimistic overlay and no polling.
  // apply-manual bakes it into data.json/history/scheduled report in the background.
  CORRECTIONS=doc.corrections;
  render();
  setS(L("fixSaved"));
  workerDispatch("apply-manual.yml");   // fire-and-forget
}

// ---- Rate report → triggers the server-side send-report workflow on GitHub ----
const REPORT_TO="HK-ID Remittance";
const MONITOR_REPO="gotodye/hk-fx-monitor";  // private repo hosting send-report.yml

function reportCardHtml(){
  return `<section class="card"><h2>${L("sendReport")} <span class="tag">${L("toKyle")}</span></h2>`
    +`<div class="edit-form">`
    +`<div class="edit-row"><button class="btn secondary" id="previewReport" type="button">${L("preview")}</button>`
    +`<button class="btn" id="sendReport" type="button" style="display:none">${L("send")}</button></div>`
    +`<pre id="reportPreview" class="report-pre" style="display:none"></pre>`
    +`<div id="reportStatus" class="muted"></div>`
    +`<p class="muted" style="margin:6px 0 0">${L("reportHint")}</p>`
    +`</div></section>`;
}

function reportDir(key){
  const h=(DATA.history||{})[key];
  if(!h||h.length<2) return "";
  const cur=h[h.length-1].rate, prev=h[h.length-2].rate;
  return cur>prev?" ▲":cur<prev?" ▼":"";
}

function buildReport(){
  const now=(DATA.generated_at?new Date(DATA.generated_at):new Date()).toLocaleString(loc(),{timeZone:"Asia/Taipei"});
  const NA=L("rNA"), BEST=L("rBest"), SEP=(LANG==="en"?": ":"：");
  const lines=[L("rTitle"),L("rTo")+REPORT_TO,L("rAsOf")+now];
  for(const [f,t] of DATA.corridors){
    lines.push("",`【${f} → ${t}】`);
    const rows=DATA.providers.filter(p=>p.corridors.some(c=>c[0]===f&&c[1]===t))
      .map(p=>({name:p.name,key:K(p.key,f,t),cell:cellFor(p.key,f,t)}));
    const rates=rows.filter(x=>x.cell&&x.cell.rate!=null).map(x=>x.cell.rate);
    const best=rates.length?Math.max(...rates):null;
    for(const {name,key,cell} of rows){
      const has=cell&&cell.rate!=null;
      const r=has?Number(cell.rate).toFixed(4):NA;
      const arrow=has?reportDir(key):"";
      const star=(has&&best!=null&&cell.rate===best)?BEST:"";
      lines.push(`• ${name}${SEP}${r}${arrow}${star}`);
    }
  }
  return lines.join("\n");
}

function wireReport(){
  const pv=document.getElementById("previewReport");
  const sd=document.getElementById("sendReport");
  const box=document.getElementById("reportPreview");
  if(pv) pv.addEventListener("click",async ()=>{
    // Preview the CURRENT live data (not a snapshot the page loaded earlier), so
    // what you review — and then send — reflects the latest rates. FB-OCR values
    // drift between scrapes, so a stale in-memory copy is what made 發送≠預覽.
    try{ const r=await fetch("./data.json?_="+Date.now(),{cache:"no-store"});
      if(r.ok){ DATA=await r.json(); render(); } }catch(e){}
    box.textContent=buildReport(); box.style.display="block";
    if(sd) sd.style.display="inline-flex";
    const s=document.getElementById("reportStatus"); if(s) s.textContent="";
  });
  if(sd) sd.addEventListener("click",sendReport);
}

// Trigger the server-side send-report workflow (webhook lives in a repo Secret).
async function sendReport(){
  const st=document.getElementById("reportStatus");
  const setS=m=>{ if(st) st.textContent=m; };
  if(!signedIn()){ setS(L("needLogin")); return; }
  setS(L("rpTriggering"));
  // Send EXACTLY the text shown in the preview box (WYSIWYG). The workflow posts
  // this verbatim instead of re-fetching data.json and rebuilding from a possibly
  // different snapshot — so 發送 always matches 預覽. Fall back to composing now if
  // the box is somehow empty.
  const box=document.getElementById("reportPreview");
  const body=(box && box.textContent.trim()) ? box.textContent : buildReport();
  const d=await workerDispatch("send-report.yml",{lang:LANG, body});
  setS(d.ok?L("rpDone"):`${L("stFail")}${d.error}`);
}

function drawCorridor(f,t){
  const series={};
  for(const p of DATA.providers){
    if(!p.corridors.some(c=>c[0]===f&&c[1]===t))continue;
    const h=DATA.history[K(p.key,f,t)];
    if(h&&h.length)series[p.name]=h;
  }
  drawChart(series);
}

function smoothPath(pts){
  if(pts.length<2)return pts.length?`M${pts[0][0]},${pts[0][1]}`:"";
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

function drawChart(series){
  const svg=document.getElementById("chart"),legend=document.getElementById("legend");
  svg.innerHTML="";legend.innerHTML="";
  const W=800,H=270,padL=48,padR=16,padT=18,padB=26;
  let all=[];Object.values(series).forEach(pts=>pts.forEach(p=>all.push(p.rate)));
  if(all.length===0){svg.innerHTML='<text x="400" y="135" fill="#94A3B8" text-anchor="middle" font-size="13">尚無歷史資料</text>';return;}
  let min=Math.min(...all),max=Math.max(...all);
  const pad=(max-min)*0.15||1;min-=pad;max+=pad;const span=(max-min)||1;
  let maxLen=0;Object.values(series).forEach(pts=>maxLen=Math.max(maxLen,pts.length));
  const x=i=>padL+(maxLen<=1?(W-padL-padR)/2:i*(W-padL-padR)/(maxLen-1));
  const y=v=>H-padB-((v-min)/span)*(H-padT-padB);
  let defs="<defs>";
  Object.keys(series).forEach((_,ci)=>{const col=COLORS[ci%COLORS.length];
    defs+=`<linearGradient id="g${ci}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity="0.22"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient>`;});
  defs+="</defs>";svg.innerHTML+=defs;
  for(let g=0;g<=3;g++){const gy=padT+g*(H-padT-padB)/3;
    svg.innerHTML+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="rgba(148,163,184,0.18)"/>`;
    svg.innerHTML+=`<text x="${padL-8}" y="${(gy+4).toFixed(1)}" fill="#94A3B8" font-size="10.5" text-anchor="end">${(max-g*span/3).toFixed(2)}</text>`;}
  let ci=0;
  for(const [name,pts] of Object.entries(series)){
    const col=COLORS[ci%COLORS.length];
    if(pts.length){
      const P=pts.map((p,i)=>[x(i),y(p.rate)]);
      const line=smoothPath(P);
      const area=line+` L${P[P.length-1][0].toFixed(1)},${H-padB} L${P[0][0].toFixed(1)},${H-padB} Z`;
      svg.innerHTML+=`<path d="${area}" fill="url(#g${ci})"/>`;
      svg.innerHTML+=`<path d="${line}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
      const last=P[P.length-1];
      svg.innerHTML+=`<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
    }
    legend.innerHTML+=`<span><span class="dot" style="background:${col}"></span>${esc(name)}</span>`;
    ci++;
  }
}
